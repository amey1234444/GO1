name: macOS Apple Silicon DMG with bundled transcription runtime
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
  workflow_dispatch:
    inputs:
      require_notarization:
        description: Fail unless Apple signing and notarization credentials are configured
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  macos-arm64-dmg:
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    outputs:
      artifact_name: ${{ steps.release.outputs.artifact_name }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      notarized: ${{ steps.release.outputs.notarized }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Report build started
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: node scripts/macos/publish-portal.js start
      - name: Install app dependencies
        run: npm install --no-audit --no-fund
      - name: Resolve and install Electron runtime before static inspection
        run: node -e "console.log(require('electron'))"
      - name: Compare official Electron framework with GO Client static fingerprints
        run: python3 scripts/research/compare-electron.py --reference docs/evidence/go-client-native-audit-v020.json --framework node_modules/electron/dist --output out/release-evidence/framework-comparison.json
      - name: Run source checks and automated tests
        id: checks
        run: |
          mkdir -p out/release-evidence
          set -o pipefail
          (npm run check && npm test) 2>&1 | tee out/release-evidence/checks.log
      - name: Verify native window capture-protection API state
        run: npm run smoke:protection
      - name: Build bundled transcription tools (ARM64)
        id: native
        run: |
          mkdir -p out/release-evidence
          set -o pipefail
          bash scripts/build-macos-native.sh 2>&1 | tee out/release-evidence/native.log
      - name: Bundle verified multilingual speech model
        id: speech
        run: |
          mkdir -p out/release-evidence
          set -o pipefail
          node scripts/bundle-speech-model.js 2>&1 | tee out/release-evidence/speech.log
      - name: Configure Mac signing for trusted builds
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GO1_REQUIRE_NOTARIZATION: ${{ inputs.require_notarization || 'false' }}
        run: bash scripts/macos/configure-signing.sh
      - name: Build and sign Apple Silicon DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run make:mac
      - name: Select smaller verified DMG compression
        run: python3 scripts/macos/optimize-dmg.py
      - name: Mount DMG and verify app contents and native tools
        env:
          GO1_BUNDLE_NATIVE: '1'
        run: bash scripts/verify-dmg.sh
      - name: Install local AI runtime for packaged-app validation
        run: brew install ollama
      - name: Launch DMG app and verify real speech and AI pipelines
        id: smoke
        run: |
          set -o pipefail
          node scripts/macos/smoke-packaged.js 2>&1 | tee out/release-evidence/smoke.log
      - name: Upload packaged-app verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GO1-packaged-app-evidence-arm64-${{ github.run_id }}
          path: out/release-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Prepare direct-download release assets
        id: release
        run: python3 scripts/macos/prepare-release.py
      - name: Publish verified DMG to protected download portal
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: node scripts/macos/publish-portal.js upload
      - name: Report final build status and errors
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GO1_BUILD_STATUS: ${{ job.status }}
          GO1_STAGE_RESULTS: ${{ toJSON(steps) }}
        run: |
          mkdir -p out/release-evidence
          node -e "const s=JSON.parse(process.env.GO1_STAGE_RESULTS);require('fs').writeFileSync('out/release-evidence/stage-results.json',JSON.stringify(['checks','native','speech','smoke'].map(id=>({id,name:id,outcome:s[id]?.outcome}))))"
          node scripts/macos/publish-portal.js report
      - name: Remove temporary signing credentials
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/go1-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/go1-signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/go1-certificate.p12"
