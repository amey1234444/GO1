name: macOS Apple Silicon DMG with bundled transcription runtime
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos-arm64-dmg:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app dependencies
        run: npm install --no-audit --no-fund
      - name: Resolve and install Electron runtime before static inspection
        run: node -e "console.log(require('electron'))"
      - name: Compare official Electron framework with GO Client static fingerprints
        run: python3 scripts/research/compare-electron.py --reference docs/evidence/go-client-native-audit-v020.json --framework node_modules/electron/dist --output out/release-evidence/framework-comparison.json
      - name: Run source checks and automated tests
        run: npm run check && npm test
      - name: Verify native window capture-protection API state
        run: npm run smoke:protection
      - name: Build bundled transcription tools (ARM64)
        run: bash scripts/build-macos-native.sh
      - name: Build Apple Silicon DMG
        run: npm run make:mac
      - name: Mount DMG and verify app contents and native tools
        env:
          GO1_BUNDLE_NATIVE: '1'
        run: bash scripts/verify-dmg.sh
      - name: Install local AI runtime for packaged-app validation
        run: brew install ollama
      - name: Launch DMG app and verify real speech and AI pipelines
        run: node scripts/macos/smoke-packaged.js
      - name: Upload packaged-app verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GO1-packaged-app-evidence-arm64-v0.20.0
          path: out/release-evidence/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: GO1-macOS-arm64-v0.20.0-live-presentation-unsigned-DMG
          path: out/make/**/*.dmg
          if-no-files-found: error
          retention-days: 14
