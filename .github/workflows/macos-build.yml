name: macOS Apple Silicon DMG with bundled transcription runtime
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
  workflow_dispatch:
    inputs:
      require_notarization:
        description: Fail unless Apple signing and notarization credentials are configured
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  macos-arm64-dmg:
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      artifact_name: ${{ steps.release.outputs.artifact_name }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      notarized: ${{ steps.release.outputs.notarized }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app dependencies
        run: npm install --no-audit --no-fund
      - name: Resolve and install Electron runtime before static inspection
        run: node -e "console.log(require('electron'))"
      - name: Compare official Electron framework with GO Client static fingerprints
        run: python3 scripts/research/compare-electron.py --reference docs/evidence/go-client-native-audit-v020.json --framework node_modules/electron/dist --output out/release-evidence/framework-comparison.json
      - name: Run source checks and automated tests
        run: npm run check && npm test
      - name: Verify native window capture-protection API state
        run: npm run smoke:protection
      - name: Build bundled transcription tools (ARM64)
        run: bash scripts/build-macos-native.sh
      - name: Configure Mac signing for trusted builds
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GO1_REQUIRE_NOTARIZATION: ${{ inputs.require_notarization || 'false' }}
        run: bash scripts/macos/configure-signing.sh
      - name: Build and sign Apple Silicon DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run make:mac
      - name: Select smaller verified DMG compression
        run: python3 scripts/macos/optimize-dmg.py
      - name: Mount DMG and verify app contents and native tools
        env:
          GO1_BUNDLE_NATIVE: '1'
        run: bash scripts/verify-dmg.sh
      - name: Install local AI runtime for packaged-app validation
        run: brew install ollama
      - name: Launch DMG app and verify real speech and AI pipelines
        run: node scripts/macos/smoke-packaged.js
      - name: Upload packaged-app verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GO1-packaged-app-evidence-arm64-${{ github.run_id }}
          path: out/release-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Prepare direct-download release assets
        id: release
        run: python3 scripts/macos/prepare-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          path: out/distribution/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing credentials
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/go1-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/go1-signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/go1-certificate.p12"

  publish-dmg:
    needs: macos-arm64-dmg
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.macos-arm64-dmg.outputs.artifact_name }}
          path: distribution
      - name: Publish DMG and checksums directly on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.macos-arm64-dmg.outputs.release_tag }}
          NOTARIZED: ${{ needs.macos-arm64-dmg.outputs.notarized }}
        shell: bash
        run: |
          set -euo pipefail
          cd distribution
          shasum -a 256 -c ./*.dmg.sha256
          flags=(--prerelease --latest=false)
          label='Ad-hoc preview — not Apple-notarized'
          if [[ "$NOTARIZED" == true ]]; then
            flags=(--latest)
            label='Developer ID signed and Apple-notarized'
          fi
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" \
            --title "GO1 $RELEASE_TAG — $label" --notes-file RELEASE_NOTES.md \
            "${flags[@]}" ./*.dmg ./*.dmg.sha256 ./package-integrity.json ./packaged-smoke.json ./download-policy.json ./compression.json
          echo "Direct DMG: https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/$(basename ./*.dmg)" >> "$GITHUB_STEP_SUMMARY"
